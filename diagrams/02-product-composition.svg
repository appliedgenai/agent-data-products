<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1110" viewBox="0 0 1200 1110" role="img"><title>One agent task composes three product contracts</title><desc>A cohort, a calculation and supporting documents answer different parts of the question.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#007F7B"/></marker></defs><rect width="1200" height="1110" fill="#F7FAFC"/>
<text x="42" y="47" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#163247">One agent task composes three product contracts</text>
<text x="42" y="83" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">A cohort, a calculation and supporting documents answer different parts of the question.</text>
<rect x="42" y="119" width="1116" height="65" rx="12" fill="#163247" stroke="#163247" stroke-width="1.5"/>
<text x="62" y="159" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#FFFFFF">“Why did on-time delivery fall for our strategic customers?”</text>
<rect x="42" y="225" width="1116" height="108" rx="12" fill="#FFFFFF" stroke="#CDDCE3" stroke-width="1.5"/><text x="60" y="258" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#163247">1  Establish the task boundary</text><text x="60" y="293" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">Actual caller + tenant · Approved meaning of strategic customer · Period · Product versions</text><text x="60" y="322" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">Agent plans the calls; application and product services enforce access, query and cost limits.</text>
<path d="M600 186 V217" fill="none" stroke="#007F7B" stroke-width="3"  marker-end="url(#arrow)"/>
<rect x="42" y="382" width="390" height="183" rx="12" fill="#E6F5F0" stroke="#CDDCE3" stroke-width="1.5"/><text x="60" y="415" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#163247">2  Relationship product</text><text x="60" y="450" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">Resolve the approved cohort</text><text x="60" y="479" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">at the declared effective time.</text><text x="60" y="508" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070"></text><text x="60" y="537" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">Return scoped IDs + lineage.</text>
<rect x="721" y="382" width="437" height="183" rx="12" fill="#EAF0FB" stroke="#CDDCE3" stroke-width="1.5"/><text x="739" y="415" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#163247">3  Metrics product</text><text x="739" y="450" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">Calculate approved on-time rate</text><text x="739" y="479" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">for that cohort and period.</text><text x="739" y="508" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070"></text><text x="739" y="537" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">Return values + query evidence.</text>
<path d="M235 335 V374" fill="none" stroke="#007F7B" stroke-width="3"  marker-end="url(#arrow)"/>
<path d="M435 474 H710" fill="none" stroke="#007F7B" stroke-width="3"  marker-end="url(#arrow)"/>
<text x="452" y="421" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#007F7B">Cohort reference</text>
<text x="452" y="450" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#007F7B">+ scope + version</text>
<path d="M940 568 V598 H302 V637" fill="none" stroke="#007F7B" stroke-width="3"  marker-end="url(#arrow)"/>
<path d="M1050 568 V637" fill="none" stroke="#007F7B" stroke-width="3"  marker-end="url(#arrow)"/>
<rect x="42" y="648" width="520" height="175" rx="12" fill="#FFF3DF" stroke="#CDDCE3" stroke-width="1.5"/><text x="60" y="681" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#163247">4  Retrieval product</text><text x="60" y="716" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">Find permitted incident evidence for</text><text x="60" y="745" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">the affected locations and dates.</text><text x="60" y="774" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070"></text><text x="60" y="803" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">Return passages + citations + coverage.</text>
<rect x="599" y="648" width="559" height="175" rx="12" fill="#FFFFFF" stroke="#CDDCE3" stroke-width="1.5"/><text x="617" y="681" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#163247">5  Reconcile the response</text><text x="617" y="716" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">Validate meaning, time and product versions.</text><text x="617" y="745" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">Separate measured change from hypothesis.</text><text x="617" y="774" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">Answer, qualify missing context or stop.</text><text x="617" y="803" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">Retain a traceable product-consumption record.</text>
<path d="M565 746 H587" fill="none" stroke="#007F7B" stroke-width="3"  marker-end="url(#arrow)"/>
<text x="340" y="615" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#007F7B">Metric result directs the evidence search</text>
<path d="M878 826 V875" fill="none" stroke="#007F7B" stroke-width="3"  marker-end="url(#arrow)"/>
<rect x="42" y="889" width="1116" height="110" rx="12" fill="#E6F5F0" stroke="#CDDCE3" stroke-width="1.5"/>
<text x="62" y="925" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#163247">Result: 90% → 80%; unchanged regional rates; regional mix explains the arithmetic.</text>
<text x="62" y="959" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">Incident text is a lead for investigation, not proof of cause.</text><text x="62" y="988" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">A suggested follow-up requires a separately authorized workflow before any system is changed.</text>
<text x="42" y="1052" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#476070">Access is checked on every call and final disclosure. Product composition creates no extra permission.</text>
<text x="42" y="1087" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#476070">DATA PRODUCTS FOR THE AGENT ECONOMY  ·  MOHIT MITTAL</text>
</svg>