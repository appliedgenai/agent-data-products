<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1070" viewBox="0 0 1200 1070" role="img"><title>Publish owned data products for many agents</title><desc>Relationships, business measures and evidence remain reusable across agent teams.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#007F7B"/></marker></defs><rect width="1200" height="1070" fill="#F7FAFC"/>
<text x="42" y="47" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#163247">Publish owned data products for many agents</text>
<text x="42" y="83" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">Relationships, business measures and evidence remain reusable across agent teams.</text>
<text x="42" y="129" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#275CB1">AGENT CONSUMERS</text>
<rect x="42" y="145" width="282" height="105" rx="12" fill="#EAF0FB" stroke="#CDDCE3" stroke-width="1.5"/><text x="60" y="178" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#163247">Account-review agent</text><text x="60" y="213" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">Prepare a customer brief</text>
<rect x="344" y="145" width="282" height="105" rx="12" fill="#EAF0FB" stroke="#CDDCE3" stroke-width="1.5"/><text x="362" y="178" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#163247">Metric agent</text><text x="362" y="213" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">Investigate a KPI change</text>
<rect x="646" y="145" width="282" height="105" rx="12" fill="#EAF0FB" stroke="#CDDCE3" stroke-width="1.5"/><text x="664" y="178" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#163247">Service agent</text><text x="664" y="213" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">Assess an open case</text>
<path d="M183 300 V255" fill="none" stroke="#007F7B" stroke-width="3"  marker-end="url(#arrow)"/>
<path d="M485 300 V255" fill="none" stroke="#007F7B" stroke-width="3"  marker-end="url(#arrow)"/>
<path d="M787 300 V255" fill="none" stroke="#007F7B" stroke-width="3"  marker-end="url(#arrow)"/>
<rect x="42" y="308" width="886" height="120" rx="12" fill="#163247" stroke="#163247" stroke-width="1.5"/>
<text x="62" y="343" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">DISCOVERY AND GOVERNED CONSUMPTION</text>
<text x="62" y="377" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#FFFFFF">Catalog → select product/version → authorize → invoke typed interface</text><text x="62" y="406" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#FFFFFF">API / query service / MCP adapter · Limits, evidence and usage metering</text>
<path d="M183 473 V434" fill="none" stroke="#007F7B" stroke-width="3"  marker-end="url(#arrow)"/>
<path d="M485 473 V434" fill="none" stroke="#007F7B" stroke-width="3"  marker-end="url(#arrow)"/>
<path d="M787 473 V434" fill="none" stroke="#007F7B" stroke-width="3"  marker-end="url(#arrow)"/>
<rect x="42" y="483" width="282" height="221" rx="12" fill="#E6F5F0" stroke="#CDDCE3" stroke-width="1.5"/><text x="60" y="516" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#163247">Knowledge product</text><text x="60" y="551" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">Customer Relationship Graph</text><text x="60" y="580" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070"></text><text x="60" y="609" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">Approved entities + relations</text><text x="60" y="638" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">Effective time + provenance</text><text x="60" y="667" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">Owner: Customer domain</text>
<rect x="344" y="483" width="282" height="221" rx="12" fill="#EAF0FB" stroke="#CDDCE3" stroke-width="1.5"/><text x="362" y="516" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#163247">Metrics product</text><text x="362" y="551" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">Delivery Metrics</text><text x="362" y="580" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070"></text><text x="362" y="609" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">Defined measures + queries</text><text x="362" y="638" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">Grain + cohort + calendar</text><text x="362" y="667" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">Owner: Fulfillment domain</text>
<rect x="646" y="483" width="282" height="221" rx="12" fill="#FFF3DF" stroke="#CDDCE3" stroke-width="1.5"/><text x="664" y="516" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#163247">Retrieval product</text><text x="664" y="551" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">Operations Evidence</text><text x="664" y="580" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070"></text><text x="664" y="609" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">Vector / hybrid search</text><text x="664" y="638" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">Citations + access mapping</text><text x="664" y="667" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">Owner: Service operations</text>
<rect x="42" y="723" width="886" height="64" rx="12" fill="#FFFFFF" stroke="#CDDCE3" stroke-width="1.5"/>
<text x="62" y="751" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#163247">Every product: consumer promise · contract · owner · release · evaluation</text>
<text x="62" y="775" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#476070">Underlying stores and indexes implement the product; interfaces carry its commitments.</text>
<path d="M183 847 V795" fill="none" stroke="#007F7B" stroke-width="3"  marker-end="url(#arrow)"/>
<path d="M485 847 V795" fill="none" stroke="#007F7B" stroke-width="3"  marker-end="url(#arrow)"/>
<path d="M787 847 V795" fill="none" stroke="#007F7B" stroke-width="3"  marker-end="url(#arrow)"/>
<rect x="42" y="853" width="886" height="101" rx="12" fill="#FFFFFF" stroke="#CDDCE3" stroke-width="1.5"/>
<text x="62" y="888" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#163247">EXISTING ENTERPRISE DATA FOUNDATION</text>
<text x="62" y="920" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">Business systems · Master data · Lakehouse / warehouse · Approved documents</text>
<rect x="952" y="145" width="206" height="809" rx="12" fill="#FFFFFF" stroke="#CDDCE3" stroke-width="1.5"/>
<text x="970" y="181" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#007F7B">PRODUCT OPERATIONS</text>
<text x="970" y="220" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#163247">Domain ownership</text><text x="970" y="261" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#163247">Current entitlements</text><text x="970" y="302" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#163247">Identity + time</text><text x="970" y="343" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#163247">Freshness + quality</text><text x="970" y="384" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#163247">Versions + lineage</text><text x="970" y="425" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#163247">Deletion + recovery</text><text x="970" y="466" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#163247">Usage + unit cost</text>
<text x="970" y="554" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#007F7B">REVIEWED LEARNING</text>
<text x="970" y="592" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#163247">Agent task traces</text><text x="970" y="625" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#163247">and user feedback</text><text x="970" y="658" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#163247">↓</text><text x="970" y="691" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#163247">Reproduce + route</text><text x="970" y="724" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#163247">to the right owner</text><text x="970" y="757" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#163247">↓</text><text x="970" y="790" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#163247">Test + approve</text><text x="970" y="823" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#163247">a product release</text>
<text x="970" y="894" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#476070">Controls apply</text><text x="970" y="919" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#476070">at every interface.</text>
