<path d="M952 843 H941 V773 H934" fill="none" stroke="#007F7B" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
<text x="42" y="1001" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#007F7B">The next agent reuses a supported product; product changes must respect existing consumers.</text>
<text x="42" y="1047" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#476070">DATA PRODUCTS FOR THE AGENT ECONOMY  ·  MOHIT MITTAL</text>
