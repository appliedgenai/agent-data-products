<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img"><title>Connect agent products to the existing data estate</title><desc>An optional “Platinum” label names serving products; it is not a universal fourth quality tier.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#007F7B"/></marker></defs><rect width="1200" height="1000" fill="#F7FAFC"/>
<text x="42" y="47" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#163247">Connect agent products to the existing data estate</text>
<text x="42" y="83" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">An optional “Platinum” label names serving products; it is not a universal fourth quality tier.</text>
<rect x="42" y="135" width="330" height="119" rx="12" fill="#FFFFFF" stroke="#CDDCE3" stroke-width="1.5"/><text x="60" y="168" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#163247">Bronze</text><text x="60" y="203" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">Captured records / documents</text><text x="60" y="232" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">Source fidelity + provenance</text>
<rect x="435" y="135" width="330" height="119" rx="12" fill="#FFFFFF" stroke="#CDDCE3" stroke-width="1.5"/><text x="453" y="168" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#163247">Silver</text><text x="453" y="203" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">Validated detail and entities</text><text x="453" y="232" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">Identity + quality + time</text>
<rect x="828" y="135" width="330" height="119" rx="12" fill="#FFFFFF" stroke="#CDDCE3" stroke-width="1.5"/><text x="846" y="168" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#163247">Gold</text><text x="846" y="203" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">Business-ready models</text><text x="846" y="232" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">Measures + relationships</text>
<path d="M376 194 H424" fill="none" stroke="#007F7B" stroke-width="3"  marker-end="url(#arrow)"/>
<path d="M768 194 H816" fill="none" stroke="#007F7B" stroke-width="3"  marker-end="url(#arrow)"/>
<path d="M600 257 V299" fill="none" stroke="#007F7B" stroke-width="3"  marker-end="url(#arrow)"/>
<path d="M993 257 V299" fill="none" stroke="#007F7B" stroke-width="3"  marker-end="url(#arrow)"/>
<rect x="42" y="312" width="1116" height="65" rx="12" fill="#FFFFFF" stroke="#CDDCE3" stroke-width="1.5"/>
<text x="62" y="352" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#163247">Select eligible detail, business models and approved content under each product contract.</text>
<path d="M207 380 V425" fill="none" stroke="#007F7B" stroke-width="3"  marker-end="url(#arrow)"/>
<path d="M600 380 V425" fill="none" stroke="#007F7B" stroke-width="3"  marker-end="url(#arrow)"/>
<path d="M993 380 V425" fill="none" stroke="#007F7B" stroke-width="3"  marker-end="url(#arrow)"/>
<rect x="24" y="437" width="1152" height="257" rx="12" fill="#FFFFFF" stroke="#007F7B" stroke-width="1.5"/>
<text x="42" y="472" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#007F7B">AGENT DATA-PRODUCT SERVING  ·  OPTIONAL PLATINUM</text>
<rect x="42" y="495" width="330" height="176" rx="12" fill="#E6F5F0" stroke="#CDDCE3" stroke-width="1.5"/><text x="60" y="528" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#163247">Knowledge graph</text><text x="60" y="563" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">Relationships from approved</text><text x="60" y="592" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">entities, models and sources</text><text x="60" y="621" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">Contract + owner + provenance</text>
<rect x="435" y="495" width="330" height="176" rx="12" fill="#EAF0FB" stroke="#CDDCE3" stroke-width="1.5"/><text x="453" y="528" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#163247">Semantic metrics</text><text x="453" y="563" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">One authoritative definition</text><text x="453" y="592" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">over suitable detailed models</text><text x="453" y="621" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">Contract + owner + tests</text>
<rect x="828" y="495" width="330" height="176" rx="12" fill="#FFF3DF" stroke="#CDDCE3" stroke-width="1.5"/><text x="846" y="528" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#163247">Retrieval / vector index</text><text x="846" y="563" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">Eligible content + source links</text><text x="846" y="592" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">Access and deletion mappings</text><text x="846" y="621" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">Contract + owner + evaluation</text>
<path d="M207 700 V750" fill="none" stroke="#007F7B" stroke-width="3"  marker-end="url(#arrow)"/>
<path d="M600 700 V750" fill="none" stroke="#007F7B" stroke-width="3"  marker-end="url(#arrow)"/>
<path d="M993 700 V750" fill="none" stroke="#007F7B" stroke-width="3"  marker-end="url(#arrow)"/>
<rect x="42" y="763" width="1116" height="91" rx="12" fill="#163247" stroke="#163247" stroke-width="1.5"/>
<text x="62" y="801" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#FFFFFF">Agent consumers discover and invoke the supported interfaces</text>
<text x="62" y="833" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#FFFFFF">Products can share engines. A new product does not require a new database or duplicate definition.</text>
<text x="42" y="904" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#476070">Do not force documents or relationship detail through lossy reporting aggregates.</text><text x="42" y="933" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#476070">Product ownership covers source dependencies, serving behavior and consumer changes.</text>
<text x="42" y="977" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#476070">DATA PRODUCTS FOR THE AGENT ECONOMY  ·  MOHIT MITTAL</text>
</svg>