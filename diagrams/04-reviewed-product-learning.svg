<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1115" viewBox="0 0 1200 1115" role="img"><title>Improve shared products through evaluated agent use</title><desc>Capture evidence, identify the defective component, then release an accountable correction.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#007F7B"/></marker></defs><rect width="1200" height="1115" fill="#F7FAFC"/>
<text x="42" y="47" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#163247">Improve shared products through evaluated agent use</text>
<text x="42" y="83" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">Capture evidence, identify the defective component, then release an accountable correction.</text>
<rect x="42" y="132" width="530" height="144" rx="12" fill="#EAF0FB" stroke="#CDDCE3" stroke-width="1.5"/><text x="60" y="165" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#163247">1  Observe the completed task</text><text x="60" y="200" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">Product IDs + versions + scoped inputs</text><text x="60" y="229" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">Queries / retrieval results + checks + cost</text><text x="60" y="258" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">User feedback and permitted failure evidence</text>
<rect x="628" y="132" width="530" height="144" rx="12" fill="#FFFFFF" stroke="#CDDCE3" stroke-width="1.5"/><text x="646" y="165" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#163247">2  Reproduce and diagnose</text><text x="646" y="200" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">Was meaning, data, retrieval or access wrong?</text><text x="646" y="229" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">Was the agent plan or tool adapter wrong?</text><text x="646" y="258" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">Was the expected answer or evaluator wrong?</text>
<path d="M576 202 H617" fill="none" stroke="#007F7B" stroke-width="3"  marker-end="url(#arrow)"/>
<path d="M895 280 V324" fill="none" stroke="#007F7B" stroke-width="3"  marker-end="url(#arrow)"/>
<rect x="42" y="338" width="1116" height="266" rx="12" fill="#FFFFFF" stroke="#CDDCE3" stroke-width="1.5"/>
<text x="62" y="375" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#163247">3  Route the defect to the accountable owner</text>
<rect x="62" y="401" width="330" height="177" rx="12" fill="#E6F5F0" stroke="#CDDCE3" stroke-width="1.5"/><text x="80" y="434" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#163247">Product owner</text><text x="80" y="469" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">Identity / semantic definition</text><text x="80" y="498" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">Graph fact / index coverage</text><text x="80" y="527" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">Freshness / access mapping</text>
<rect x="435" y="401" width="330" height="177" rx="12" fill="#EAF0FB" stroke="#CDDCE3" stroke-width="1.5"/><text x="453" y="434" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#163247">Agent / platform owner</text><text x="453" y="469" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">Plan or product selection</text><text x="453" y="498" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">Context / adapter / application</text><text x="453" y="527" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">Model behavior or tool use</text>
<rect x="808" y="401" width="330" height="177" rx="12" fill="#FFF3DF" stroke="#CDDCE3" stroke-width="1.5"/><text x="826" y="434" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#163247">Evaluation owner</text><text x="826" y="469" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">Wrong expected answer</text><text x="826" y="498" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">Outdated reference versions</text><text x="826" y="527" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">Rubric or judge defects</text>
<path d="M600 607 V628 H307 V655" fill="none" stroke="#007F7B" stroke-width="3"  marker-end="url(#arrow)"/>
<rect x="42" y="666" width="530" height="161" rx="12" fill="#FFFFFF" stroke="#CDDCE3" stroke-width="1.5"/><text x="60" y="699" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#163247">4  Compare the candidate</text><text x="60" y="734" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">Product checks + consumer regression</text><text x="60" y="763" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">Representative permission / time cases</text><text x="60" y="792" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">Stable baseline + protected held-out cases</text><text x="60" y="821" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">Include a second agent consumer.</text>
<rect x="628" y="666" width="530" height="161" rx="12" fill="#E6F5F0" stroke="#CDDCE3" stroke-width="1.5"/><text x="646" y="699" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#163247">5  Approve and release</text><text x="646" y="734" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">Owner accepts changed behavior</text><text x="646" y="763" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">Publish compatible versions / migration</text><text x="646" y="792" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">Monitor limited rollout and rollback</text><text x="646" y="821" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#476070">Retain current access and deletion rules.</text>
<path d="M576 746 H617" fill="none" stroke="#007F7B" stroke-width="3"  marker-end="url(#arrow)"/>
<path d="M895 830 V873" fill="none" stroke="#007F7B" stroke-width="3"  marker-end="url(#arrow)"/>
<rect x="42" y="887" width="1116" height="107" rx="12" fill="#163247" stroke="#163247" stroke-width="1.5"/>
<text x="62" y="924" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">6  Measure whether reuse improved</text>
<text x="62" y="958" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#FFFFFF">Correct accepted tasks · Consumer onboarding effort · Recurrence · Total cost per accepted task</text>
<path d="M44 940 H16 V202 H34" fill="none" stroke="#007F7B" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
<text x="42" y="1042" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#476070">Feedback is an input to review. It is not automatically a fact, a training label or a published product update.</text>
<text x="42" y="1092" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#476070">DATA PRODUCTS FOR THE AGENT ECONOMY  ·  MOHIT MITTAL</text>
</svg>